<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tu cotización · Gaby Bravo</title>
<meta name="description" content="Tu cotización de peinado y maquillaje con Gaby Bravo, maquilladora profesional y especialista en peinado en Barcelona y Lechería.">
<meta property="og:title" content="Tu cotización · Gaby Bravo">
<meta property="og:description" content="Servicios, total, qué incluye y cómo reservar tu fecha.">
<meta property="og:image" content="img/og.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/icono-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Lato:wght@300;400;700&family=Mrs+Saint+Delafield&display=swap">
<style>
@font-face { font-family: "Bodoni Moda"; src: url(fonts/bodoni-moda-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Bodoni Moda"; src: url(fonts/bodoni-moda-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: "Mrs Saint Delafield"; src: url(fonts/mrs-saint-delafield-latin-400-normal.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "Lato"; src: url(fonts/lato-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Lato"; src: url(fonts/lato-latin-700-normal.woff2) format("woff2"); font-weight: 700; font-display: swap; }
:root { --hueso: #F5EBE1; --hueso-claro: #FBF6F0; --tinta: #222222; --tinta-suave: #6B5A52; --vino: #4F161E; --vino-hondo: #3A0F16; --arena: #B79D83; --piedra: #DCCFC3; --f-display: "Bodoni Moda", Didot, "Times New Roman", serif; --f-script: "Mrs Saint Delafield", cursive; --f-texto: Lato, "Helvetica Neue", Arial, sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--hueso); color: var(--tinta); font: 400 16px/1.55 var(--f-texto); -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--tinta); outline-offset: 3px; }
.hoja { max-width: 640px; margin: 0 auto; padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
.cab { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 12px; letter-spacing: .06em; color: var(--tinta-suave); }
.cab img { height: 46px; width: auto; }
.cab span { text-align: right; max-width: 22ch; }
.titulo { display: grid; justify-items: center; text-align: center; margin: 30px 0 6px; line-height: 1; }
.titulo .s { font-family: var(--f-script); font-size: 76px; color: var(--vino); line-height: .9; }
.titulo .c { font-family: var(--f-display); font-size: 34px; text-transform: uppercase; margin-top: -4px; text-wrap: balance; }
.ico { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.bloque { margin-top: 26px; }
.bloque-cab { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--tinta); }
.bloque-cab .ico { width: 22px; height: 22px; color: var(--vino); }
.bloque-cab h2 { margin: 0; font: 400 22px/1.2 var(--f-display); }
.bloque-cab small { display: block; font: 400 13px var(--f-texto); color: var(--tinta-suave); margin-top: 2px; }
.datos { margin: 0; padding: 4px 0 0; }
.datos div { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--piedra); }
.datos .ico { margin-top: 2px; color: var(--vino); }
.datos dt { font-size: 13px; color: var(--tinta-suave); }
.datos dd { margin: 1px 0 0; font-family: var(--f-display); font-size: 18px; line-height: 1.3; overflow-wrap: anywhere; }
.aviso { margin: 18px 0 0; padding: 14px 16px; background: var(--hueso-claro); border-left: 3px solid var(--vino); font-size: 15px; }
.costos { margin-top: 34px; padding: 20px 18px 22px; background: var(--hueso-claro); border-top: 3px solid var(--vino); }
.costos .bloque-cab { border-bottom-color: var(--piedra); }
.items { list-style: none; margin: 0; padding: 0; counter-reset: it; }
.items li { padding: 16px 0; border-bottom: 1px dashed var(--piedra); }
.fila { display: flex; align-items: baseline; gap: 12px; }
.fila h3 { font: 400 20px/1.3 var(--f-display); margin: 0; min-width: 0; display: flex; gap: 8px; align-items: baseline; }
.fila h3::before { counter-increment: it; content: counter(it) "."; font-size: 15px; color: var(--vino); }
.fila .p { margin-left: auto; font: 400 20px var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sub { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--tinta-suave); margin: 8px 0 0; font-variant-numeric: tabular-nums; line-height: 1.45; }
.sub .ico { width: 16px; height: 16px; margin-top: 2px; color: var(--vino); }
.sub b { color: var(--tinta); }
.items details { margin: 10px 0 0; font-size: 14px; }
.items summary { cursor: pointer; font-weight: 700; color: var(--vino); list-style: none; display: inline-flex; gap: 6px; align-items: center; }
.items summary::before { content: "+"; display: inline-grid; place-items: center; width: 18px; height: 18px; border: 1px solid currentColor; border-radius: 50%; font-size: 13px; line-height: 1; }
.items details[open] summary::before { content: "−"; }
.items summary::-webkit-details-marker { display: none; }
.items details ul { margin: 8px 0 0; padding-left: 0; list-style: none; color: var(--tinta-suave); }
.items details li { padding: 2px 0 2px 20px; border: 0; position: relative; }
.items details li::before { content: "✓"; position: absolute; left: 0; color: var(--vino); font-weight: 700; }
.cuentas { margin: 16px 0 0; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; font-size: 15px; }
.cuentas dt { color: var(--tinta-suave); }
.cuentas dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.total { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; padding: 16px 18px; background: var(--vino); color: var(--hueso); }
.total span { font: 400 15px var(--f-display); letter-spacing: .08em; }
.total b { font: 400 32px var(--f-display); font-variant-numeric: tabular-nums; }
.divisas { margin: 12px 0 0; display: flex; justify-content: space-between; gap: 16px; font-weight: 700; color: var(--vino); }
.abono { margin: 12px 0 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-top: 12px; border-top: 1px solid var(--piedra); font-size: 15px; }
.abono b { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.abono small { display: block; font-weight: 400; color: var(--tinta-suave); }
.nota-bcv { font-size: 13px; color: var(--tinta-suave); margin: 10px 0 0; }
.nota { margin: 26px 0 0; padding-left: 16px; border-left: 2px solid var(--arena); font-family: var(--f-display); font-style: italic; font-size: 18px; line-height: 1.45; }
.pasos { list-style: none; counter-reset: p; margin: 14px 0 0; padding: 0; }
.pasos > li { counter-increment: p; display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 8px 0; font-size: 15px; }
.pasos > li::before { content: counter(p); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--vino); color: var(--hueso); font: 700 14px var(--f-texto); }
.metodos { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 10px 0 0; }
.metodos li { padding: 6px 12px; border: 1px solid var(--tinta); font-size: 13px; font-weight: 700; }
.plegables { margin-top: 34px; border-top: 1px solid var(--tinta); }
.plegables details { border-bottom: 1px solid var(--tinta); }
.plegables summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; padding: 16px 0; font: 400 20px var(--f-display); }
.plegables summary::-webkit-details-marker { display: none; }
.plegables summary .ico { color: var(--vino); width: 20px; height: 20px; }
.plegables summary::after { content: ""; margin-left: auto; width: 9px; height: 9px; border-right: 1.5px solid var(--tinta); border-bottom: 1.5px solid var(--tinta); transform: rotate(45deg) translateY(-3px); transition: transform .2s; }
.plegables details[open] summary::after { transform: rotate(-135deg) translateY(-3px); }
.plegables summary small { font: 400 13px var(--f-texto); color: var(--tinta-suave); }
.lista { margin: 0 0 16px; padding-left: 0; list-style: none; font-size: 15px; color: var(--tinta-suave); }
.lista li { position: relative; padding: 0 0 8px 20px; }
.lista li::before { content: "•"; position: absolute; left: 4px; color: var(--vino); font-weight: 700; }
.lista b { color: var(--tinta); }
.ref { margin-top: 18px; text-align: center; font-size: 11px; color: var(--arena); letter-spacing: .04em; }
.acciones { position: fixed; left: 0; right: 0; bottom: 0; background: var(--hueso); border-top: 1px solid var(--piedra); padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
.acciones div { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; }
.btn { display: flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 14px; border-radius: 9999px; text-decoration: none; font: 700 15px var(--f-texto); background: var(--vino); color: var(--hueso); text-align: center; }
.btn.linea { background: transparent; color: var(--tinta); box-shadow: inset 0 0 0 1.5px var(--tinta); }
.pie { text-align: center; margin-top: 40px; color: var(--tinta-suave); font-size: 14px; }
.pie .s { font-family: var(--f-script); font-size: 46px; color: var(--vino); display: block; line-height: 1; }
.vacia { text-align: center; padding: 60px 0; }
@media (max-width: 380px) { .titulo .s { font-size: 62px; } .titulo .c { font-size: 28px; } .costos { padding-inline: 14px; } }
</style>
</head>
<body>
<main class="hoja" id="hoja">
  <header class="cab"><img src="img/gb.png" alt="Gaby Bravo"><span>Maquilladora profesional y especialista en peinado</span></header>
  <div id="contenido"></div>
</main>
<nav class="acciones" id="acciones" hidden><div>
  <a class="btn" id="reservar" target="_blank" rel="noopener" href="#">Reservar mi fecha</a>
  <a class="btn linea" id="preguntar" target="_blank" rel="noopener" href="#">Preguntar</a>
</div></nav>
<script src="datos.js?v=20261111a"></script>
<script src="cotizacion.js?v=20261111a"></script>
<script>
(function () {
  const G = window.GB, Q = window.GBQ;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // Mensaje que recibe Gaby cuando la clienta toca "Reservar mi fecha":
  // trae el desglose completo para que no tenga que abrir la cotización.
  function mensajeReserva(q, folio, tot) {
    const nombre = (q.nombre || "").trim();
    const lineas = q.items.map(it => it.cant > 1
      ? `• ${it.nombre} (${it.cant} × ${Q.dinero(it.precio)}): ${Q.dinero(it.cant * it.precio)}`
      : `• ${it.nombre}: ${Q.dinero(it.precio)}`);
    const abono = tot / 2;
    const m = [
      `Hola Gaby${nombre ? `, soy ${nombre}` : ""}. Quiero reservar con la cotización ${folio}:`,
      "",
      ...lineas,
      "",
      `*Total: ${Q.dinero(tot)}* (bolívares a tasa BCV)`
    ];
    if (q.divisas) m.push(`En divisas, Zelle o Binance: ${Q.dinero(q.divisas)}`);
    m.push(`Abono del 50% para apartar: *${Q.dinero(abono)}*${q.divisas ? ` (${Q.dinero(q.divisas / 2)} en divisas)` : ""}`);
    if (q.evento || q.lugar) m.push("");
    if (q.evento) m.push(`Fecha: ${Q.fechaLarga(q.evento)}`);
    if (q.lugar) m.push(`Lugar: ${q.lugar}`);
    m.push("", "¿Me pasas los datos para hacer el abono?", "", `Mi cotización: ${location.href}`);
    return m.join("\n");
  }
  async function pintar() {
    const code = location.hash.slice(1);
    let q = null; try { q = await Q.leer(code); } catch (e) { q = null; }
    const box = document.getElementById("contenido");
    if (!q) {
      document.getElementById("acciones").hidden = true;
      box.innerHTML = `<div class="vacia"><h1 class="titulo"><span class="s">Cotización</span><span class="c">No encontrada</span></h1>
        <p>El enlace está incompleto. Pídele a Gaby que te lo vuelva a enviar.</p>
        <p><a class="btn" style="display:inline-flex" target="_blank" rel="noopener" href="${Q.wa("Hola Gaby, el enlace de mi cotización no abre. ¿Me lo reenvías?", G.contacto.whatsapp)}">Escribir a Gaby</a></p></div>`;
      return;
    }
    const folio = Q.folio(code), tot = Q.total(q);
    const vencida = q.vigencia && q.vigencia < Q.hoyISO();
    const primerNombre = (q.nombre || "ti").trim().split(/\s+/)[0];
    document.title = `Cotización para ${primerNombre} · Gaby Bravo`;
    // Íconos de línea (mismo trazo que la web)
    const I = {
      cal: '<path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/>',
      pin: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
      vence: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
      reloj: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
      cant: '<path d="M4 7h16M4 12h16M4 17h10"/>',
      recibo: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/>',
      evento: '<path d="M12 3l2.4 5 5.6.8-4 3.9.9 5.5L12 15.6 7.1 18.2l.9-5.5-4-3.9L9.6 8z"/>',
      reserva: '<path d="M5 12l4 4 10-10"/>',
      politica: '<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/>',
      antes: '<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3.5"/>'
    };
    const ico = k => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;
    // Lo que aparece debajo de cada servicio: si es tiempo, se explica que es la duración
    const detalle = (s) => {
      const d = s && s.duracion ? s.duracion.trim() : "";
      if (!d) return "";
      if (/curso/i.test(s.categoria || "") || (/^\d/.test(d) && /\b(h|min|horas?)\b/i.test(d))) return "";  // la duración no se muestra
      return `<p class="sub">${ico("info")}<span>${esc(d)}</span></p>`;
    };
    const abono = tot / 2;
    box.innerHTML = `
      <h1 class="titulo"><span class="s">Cotización</span><span class="c">Para ${esc(primerNombre)}</span></h1>
      <section class="bloque" aria-labelledby="t-evento">
        <div class="bloque-cab">${ico("evento")}<div><h2 id="t-evento">Datos de tu evento</h2></div></div>
        <dl class="datos">
          ${q.evento ? `<div>${ico("cal")}<span><dt>Fecha del evento</dt><dd>${Q.fechaLarga(q.evento)}</dd></span></div>` : ""}
          ${q.lugar ? `<div>${ico("pin")}<span><dt>Lugar</dt><dd>${esc(q.lugar)}</dd></span></div>` : ""}
          ${q.vigencia ? `<div>${ico("vence")}<span><dt>Precios válidos hasta</dt><dd>${Q.fechaLarga(q.vigencia)}</dd></span></div>` : ""}
        </dl>
      </section>
      ${vencida ? `<p class="aviso">Esta cotización venció el ${Q.fechaLarga(q.vigencia)}. Escríbeme y te la actualizo.</p>` : ""}
      <section class="costos" aria-labelledby="t-costos">
        <div class="bloque-cab">${ico("recibo")}<div><h2 id="t-costos">Desglose de servicios y costos</h2></div></div>
        <ul class="items">${q.items.map(it => {
          const s = Q.catalogo[it.cod];
          const inc = s && s.incluye && s.incluye.length ? `<details><summary>Qué incluye</summary><ul>${s.incluye.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>` : "";
          return `<li><div class="fila"><h3>${esc(it.nombre)}</h3><span class="p">${Q.dinero(it.cant * it.precio)}</span></div>
            ${it.cant > 1 ? `<p class="sub">${ico("cant")}<span><b>Cantidad: ${it.cant}</b> × ${Q.dinero(it.precio)} cada uno</span></p>` : ""}${detalle(s)}${inc}</li>`;
        }).join("")}</ul>
        <div class="total"><span>Total a pagar</span><b>${Q.dinero(tot)}</b></div>
        ${q.divisas ? `<p class="divisas"><span>Pagando en divisas, Zelle o Binance</span><span>${Q.dinero(q.divisas)}</span></p>` : ""}
        <p class="abono"><span>Abono para apartar (50%)</span><b>${Q.dinero(abono)}${q.divisas ? `<small>${Q.dinero(q.divisas / 2)} en divisas</small>` : ""}</b></p>
        <p class="nota-bcv">El total en bolívares se calcula a la tasa BCV del día del pago.</p>
      </section>
      ${q.nota ? `<p class="nota">${esc(q.nota)}</p>` : ""}
      <section class="bloque" aria-labelledby="t-reservar">
        <div class="bloque-cab">${ico("reserva")}<div><h2 id="t-reservar">Cómo reservar</h2></div></div>
        <ol class="pasos">
          <li><span>Toca <b>Reservar mi fecha</b> y escríbeme por WhatsApp.</span></li>
          <li><span>Haz el abono del 50% (${Q.dinero(abono)}) con cualquiera de estos métodos:<ul class="metodos">${G.pagos.metodos.map(m => `<li>${esc(m)}</li>`).join("")}</ul></span></li>
          <li><span>Envíame el comprobante y tu fecha queda apartada. El resto se paga el día de la cita.</span></li>
        </ol>
      </section>
      <div class="plegables">
        <details><summary>${ico("politica")}<span>Políticas del servicio<br><small>Reserva, reembolsos y cambios</small></span></summary>
          <ul class="lista">${G.politicas.map(p => `<li><b>${esc(p.t)}.</b> ${esc(p.d)}</li>`).join("")}</ul></details>
        <details><summary>${ico("antes")}<span>Antes de tu cita<br><small>Cómo llegar preparada</small></span></summary>
          <ul class="lista">${G.indicaciones.rostro.concat(G.indicaciones.cabello).map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>
      </div>
      <p class="pie"><span class="s">Gracias</span>por preferir mis servicios.<br>Gabriela Bravo · @${esc(G.contacto.instagram)}</p>
      <p class="ref">Ref. ${folio}</p>`;
    const n = G.contacto.whatsapp;
    document.getElementById("reservar").href = Q.wa(mensajeReserva(q, folio, tot), n);
    document.getElementById("preguntar").href = Q.wa(`Hola Gaby, tengo una pregunta sobre la cotización ${folio}.`, n);
    document.getElementById("reservar").textContent = vencida ? "Actualizar cotización" : "Reservar mi fecha";
    if (vencida) document.getElementById("reservar").href = Q.wa(`Hola Gaby, mi cotización ${folio} venció. ¿Me la actualizas?`, n);
    document.getElementById("acciones").hidden = false;
  }
  addEventListener("hashchange", pintar);
  pintar();
})();
</script>
</body>
</html>
