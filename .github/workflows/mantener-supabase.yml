# Supabase pausa los proyectos gratis tras 7 días con poca actividad.
# Si se pausa, los enlaces cortos de cotización dejan de abrir.
# Esta tarea hace una consulta pequeña cada día para mantenerlo activo.
name: Mantener Supabase activo
on:
  schedule:
    - cron: "17 13 * * *"   # todos los días, 9:17 a. m. hora de Venezuela
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://innaconhuyiyufxifhst.supabase.co/rest/v1/rpc/ver_cotizacion" \
            -H "apikey: sb_publishable_gbNbX--sJLD_S_vAFZIMcg_ElNfsOp3" \
            -H "Content-Type: application/json" \
            -d '{"p_id":"AAAAAAAA"}')
          echo "Respuesta: $code"
          test "$code" = "200"
