<main id="contenido" class="pcat">
  <div class="envoltura pcat-grid">
    <figure class="pcat-foto"><img id="cat-portada" src="{{PORTADA}}" alt="{{PORTADA_ALT}}" fetchpriority="high"></figure>
    <div class="pcat-cont">
      <nav class="migas" aria-label="Ruta"><a href="index.html">Inicio</a><span aria-hidden="true">/</span><span id="cat-miga">{{NOMBRE}}</span></nav>
      <h1 class="titulo"><span class="s" id="cat-script">{{SCRIPT}}</span><span class="c" id="cat-t2">{{TITULO2}}</span></h1>
      <p class="lead" id="cat-intro"></p>
      <p class="pcat-desde" id="cat-desde"></p>
      <div class="promo-aviso" id="promo-aviso" hidden></div>
      <h2 class="sr">Servicios y precios</h2>
      <ul class="servs" id="servs"></ul>
      <p class="nota-precio" id="nota-precio"></p>
    </div>
  </div>
  <section class="tira-sec" aria-labelledby="h-tira">
    <div class="envoltura"><h2 class="mini-tit" id="h-tira">Trabajos de Gaby</h2></div>
    <div class="tira" id="tira"></div>
  </section>
  <section class="envoltura otras" aria-labelledby="h-otras">
    <h2 class="mini-tit" id="h-otras">También te puede interesar</h2>
    <div class="tarjetas-cat chicas" id="otras"></div>
  </section>
</main>
